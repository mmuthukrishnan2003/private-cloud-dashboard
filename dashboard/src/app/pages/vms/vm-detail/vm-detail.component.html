<div class="vm-detail-page" *ngIf="vm as currentVm">

  <div class="page-header">
    <div>
      <h1>{{ currentVm.name }}</h1>
      <small>{{ currentVm.uuid }}</small>
    </div>

    <span
      class="status"
      [class.running]="currentVm.status === 'Running'">
      {{ currentVm.status }}
    </span>
  </div>

  <!-- Your existing VM detail content goes here -->

</div>
